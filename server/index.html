<!DOCTYPE html>
<html>
<head>
    <title>Servo Camera Control</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
</head>
<body class="text-center">
    <h1>Camera and Servo Control</h1>
    <img src="{{ url_for('video_feed') }}" width="50%" class="mb-3">

    <h3>Pan (Left / Right)</h3>
    <a href="/pan/left" class="btn btn-primary m-2" target="dummy_iframe">? Left</a>
    <a href="/pan/right" class="btn btn-primary m-2" target="dummy_iframe">Right ?</a>

    <h3>Tilt (Up / Down)</h3>
    <a href="/tilt/up" class="btn btn-secondary m-2" target="dummy_iframe">? Up</a>
    <a href="/tilt/down" class="btn btn-secondary m-2" target="dummy_iframe">Down ?</a>

    <iframe name="dummy_iframe" style="display:none;"></iframe>
</body>
</html>
