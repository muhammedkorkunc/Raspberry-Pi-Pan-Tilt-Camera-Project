<!DOCTYPE html>
<html>
  <head>
    <title>Control Interface</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    />
    <script>
      function sendCommand(endpoint) {
        fetch(endpoint)
          .then((response) => response.json())
          .then((data) => {
            if (data.status !== "ok") {
              alert("Command failed.");
            }
          })
          .catch((err) => {
            console.error("Request failed", err);
          });
      }
    </script>
  </head>
  <body class="text-center">
    <h1>Servo Directional Control</h1>

    <img src="{{ video_url }}" width="60%" class="mb-3" />

    <h3>Pan (Left / Right)</h3>
    <button onclick="sendCommand('/pan/left')" class="btn btn-primary m-2">
      ← Left
    </button>
    <button onclick="sendCommand('/pan/right')" class="btn btn-primary m-2">
      Right →
    </button>

    <h3>Tilt (Up / Down)</h3>
    <button onclick="sendCommand('/tilt/up')" class="btn btn-secondary m-2">
      ↑ Up
    </button>
    <button onclick="sendCommand('/tilt/down')" class="btn btn-secondary m-2">
      Down ↓
    </button>
  </body>
</html>
